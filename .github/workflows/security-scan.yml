name: Reusable Workflow

on:
  workflow_call:
    inputs:
      severity:
        type: string
        required: false
        default: "CRITICAL,HIGH"

jobs:
  trivy-config:
    name: Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "config"
          scan-ref: "."
          severity: ${{ inputs.severity }}
          exit-code: "1"

  trivy-fs-scan:
    name: Fs Scanners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret"
          severity: ${{ inputs.severity }}
          exit-code: "1"
